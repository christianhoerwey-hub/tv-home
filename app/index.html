<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Home</title>
</head>
<body class="layout-spotlight" style="background:#000;color:#fff">
  <div id="bg"></div>
  <div id="shade"></div>

  <header id="top">
    <div id="greeting"></div>
    <div id="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
  </header>

  <section id="spot">
    <div id="spot-name"></div>
    <div id="spot-hint">OK zum Starten</div>
  </section>

  <main id="tiles"></main>

  <footer id="legend">
    <span><i class="k red"></i>Layout</span>
    <span><i class="k green"></i>Hintergrund</span>
    <span><i class="k yellow"></i>TizenBrew</span>
    <span><i class="k blue"></i>Einstellungen</span>
  </footer>

  <div id="settings" class="hidden">
    <div class="panel">
      <h2>Einstellungen</h2>
      <div class="row-title">Layout</div>
      <div class="row" id="row-layout"></div>
      <div class="row-title">Hintergrund</div>
      <div class="row" id="row-bg"></div>
      <div class="row-title">Uhr</div>
      <div class="row" id="row-clock"></div>
      <p class="note">Zurück-Taste schließt</p>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Lader: TizenBrew hält diese Datei fest (Modulname mit Versionsnummer).
       style.css, config.js und app.js kommen immer vom neuesten Commit auf main,
       über jsDelivr mit Commit-Kennung – das umgeht den Zwischenspeicher.
       Klappt die GitHub-Abfrage nicht, werden die Dateien aus dem festen Modulstand geladen. -->
  <script>
  (function () {
    var REPO = 'christianhoerwey-hub/tv-home';

    function addScript(src, done) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = done || null;
      document.body.appendChild(s);
    }

    function load(base) {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = base + 'style.css';
      document.head.appendChild(css);
      addScript(base + 'config.js', function () { addScript(base + 'app.js'); });
    }

    var x = new XMLHttpRequest();
    x.open('GET', 'https://api.github.com/repos/' + REPO + '/commits/main');
    x.setRequestHeader('Accept', 'application/vnd.github.sha');
    x.timeout = 4000;
    x.onload = function () {
      var sha = (x.responseText || '').trim();
      if (x.status === 200 && /^[0-9a-f]{40}$/.test(sha)) load('https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/app/');
      else load('');
    };
    x.onerror = x.ontimeout = function () { load(''); };
    x.send();
  })();
  </script>
</body>
</html>
